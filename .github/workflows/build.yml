name: Prcyteras Aimbot Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure
        run: |
          mkdir -p src/main/java/com/prcyteras/prcyterasmod
          mkdir -p src/main/resources/META-INF

      - name: Write ModConfig.java
        run: |
          cat << 'EOF' > src/main/java/com/prcyteras/prcyterasmod/ModConfig.java
          package com.prcyteras.prcyterasmod;
          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.minecraftforge.fml.loading.FMLPaths;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;
          public class ModConfig {
              public boolean aimbotEnabled = true;
              public double scanRange = 32.0;
              public boolean targetMonstersOnly = true;
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static final File CONFIG_FILE = new File(FMLPaths.CONFIGDIR.get().toFile(), "prcyteras_config.json");
              public static ModConfig load() {
                  if (!CONFIG_FILE.exists()) {
                      ModConfig defaultConfig = new ModConfig();
                      save(defaultConfig);
                      return defaultConfig;
                  }
                  try (FileReader reader = new FileReader(CONFIG_FILE)) {
                      return GSON.fromJson(reader, ModConfig.class);
                  } catch (Exception e) {
                      return new ModConfig();
                  }
              }
              public static void save(ModConfig config) {
                  try {
                      CONFIG_FILE.getParentFile().mkdirs();
                      try (FileWriter writer = new FileWriter(CONFIG_FILE)) {
                          GSON.toJson(config, writer);
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

      - name: Write BowHandler.java
        run: |
          cat << 'EOF' > src/main/java/com/prcyteras/prcyterasmod/BowHandler.java
          package com.prcyteras.prcyterasmod;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.monster.Monster;
          import net.minecraft.world.entity.projectile.ShulkerBullet;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.phys.Vec3;
          import net.minecraft.world.level.Level;
          import net.minecraftforge.event.entity.player.ArrowLooseEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import java.util.Comparator;
          import java.util.function.Predicate;
          @Mod.EventBusSubscriber(modid = "prcyterasmod")
          public class BowHandler {
              private static final ModConfig CONFIG = ModConfig.load();
              @SubscribeEvent
              public static void onArrowLoose(ArrowLooseEvent event) {
                  if (!CONFIG.aimbotEnabled) return;
                  Player player = event.getEntity();
                  if (player == null) return;
                  Level level = player.level();
                  if (level.isClientSide()) return;
                  Predicate<LivingEntity> targetFilter = entity -> {
                      if (entity == player || !entity.isAlive()) return false;
                      if (CONFIG.targetMonstersOnly) {
                          return entity instanceof Monster;
                      }
                      return true;
                  };
                  LivingEntity target = level.getEntitiesOfClass(LivingEntity.class,
                          player.getBoundingBox().inflate(CONFIG.scanRange),
                          targetFilter)
                          .stream()
                          .min(Comparator.comparingDouble(e -> e.distanceTo(player)))
                          .orElse(null);
                  if (target == null) return;
                  ShulkerBullet bullet = new ShulkerBullet(EntityType.SHULKER_BULLET, level);
                  bullet.setPos(player.getX(), player.getEyePosition().y, player.getZ());
                  bullet.setTarget(target);
                  Vec3 look = player.getLookAngle();
                  bullet.setDeltaMovement(look.scale(0.5));
                  level.addFreshEntity(bullet);
                  event.setCanceled(true);
              }
          }
          EOF

      - name: Write PrcyterasMod.java
        run: |
          cat << 'EOF' > src/main/java/com/prcyteras/prcyterasmod/PrcyterasMod.java
          package com.prcyteras.prcyterasmod;
          import net.minecraftforge.fml.common.Mod;
          @Mod("prcyterasmod")
          public class PrcyterasMod {
              public PrcyterasMod() {}
          }
          EOF

      - name: Write mods.toml and pack.mcmeta
        run: |
          cat << 'EOF' > src/main/resources/META-INF/mods.toml
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"
          [[mods]]
          modId="prcyterasmod"
          version="1.0.0"
          displayName="Prcyteras Bow Aimbot"
          authors="PRCYTERAS"
          description="Zombilere karsı yasal homing bow hilesi."
          EOF
          
          cat << 'EOF' > src/main/resources/pack.mcmeta
          {"pack": {"description": "resources", "pack_format": 15}}
          EOF

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Forge MDK & Build
        run: |
          wget https://minecraftforge.net
          unzip forge-1.20.1-47.3.0-mdk.zip -d forge-mdk
          rm -rf forge-mdk/src
          cp -r src forge-mdk/
          cd forge-mdk
          chmod +x gradlew
          ./gradlew build

      - name: Upload Finished Mod File
        uses: actions/upload-artifact@v4
        with:
          name: Prcyteras_Bow_Aimbot_1.20.1
          path: forge-mdk/build/libs/*.jar
